name: Push EPG to GitHub

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  update_epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium

      - name: Run EPG Script
        run: python epg.py

      - name: Commit and Push EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add epg.xml
          git diff --staged --quiet || git commit -m "Auto-update EPG XML [skip ci]"
          git push
