name: Push Tokens to Railway
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium
      - name: Run Fetcher & EPG Script
        run: |
          python fetcher.py
          python epg.py
      - name: Push EPG to Railway
        run: |
          curl -F "file=@epg.xml" https://transmedia-playlist.up.railway.app/update_epg || true
